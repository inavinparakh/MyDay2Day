<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16324F">
<meta name="description" content="Plan. Remember. Complete. Your day planner, todo list, reminders and alarms in one app.">
<title>Navin Day Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">NDP</span>
    <div class="brand-text">
      <span class="brand-name">Navin Day Planner</span>
      <span class="brand-tag">Plan. Remember. Complete.</span>
    </div>
  </div>
  <div class="header-search">
    <input type="search" id="global-search" placeholder="Search tasks, notes, tags…" aria-label="Search">
  </div>
</header>

<main id="app-main">

  <section id="today-view" class="view active">
    <div class="today-head">
      <span class="today-label">TODAY</span>
      <h1 id="today-date">—</h1>
      <span id="current-time" class="current-time">—</span>
    </div>

    <div class="stat-grid">
      <div class="stat-card stat-high">
        <span class="stat-value" id="stat-high">0</span>
        <span class="stat-label">🔴 High Priority</span>
      </div>
      <div class="stat-card stat-pending">
        <span class="stat-value" id="stat-pending">0</span>
        <span class="stat-label">📝 Pending</span>
      </div>
      <div class="stat-card stat-carried">
        <span class="stat-value" id="stat-carried">0</span>
        <span class="stat-label">🔄 Carried Forward</span>
      </div>
      <div class="stat-card stat-completed">
        <span class="stat-value" id="stat-completed">0</span>
        <span class="stat-label">✓ Completed</span>
      </div>
    </div>

    <div id="today-timeline"></div>
  </section>

  <section id="calendar-view" class="view"></section>

  <section id="tasks-view" class="view"></section>

  <section id="completed-view" class="view"></section>

  <section id="settings-view" class="view"></section>

</main>

<button id="fab-add" class="fab" aria-label="Add task">+</button>

<nav class="bottom-nav">
  <button data-tab="today" class="active"><span class="nav-icon">🏠</span><span>Today</span></button>
  <button data-tab="calendar"><span class="nav-icon">📅</span><span>Calendar</span></button>
  <button data-tab="tasks"><span class="nav-icon">📝</span><span>Tasks</span></button>
  <button data-tab="completed"><span class="nav-icon">✓</span><span>Completed</span></button>
  <button data-tab="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
</nav>

<div id="modal-root" class="modal-root"></div>
<div id="alarm-ring-root" class="alarm-ring-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="utils.js"></script>
<script src="categories.js"></script>
<script src="tasks.js"></script>
<script src="ui.js"></script>
<script src="calendar.js"></script>
<script src="notifications.js"></script>
<script src="alarms.js"></script>
<script src="backup.js"></script>
<script src="google-drive.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
